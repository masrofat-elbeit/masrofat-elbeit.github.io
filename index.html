<style>
/* VOICE: calm household ledger, plain Modern Standard Arabic first, English on demand
   IDEA: the family's monthly account book; six shapes the user picks from (classic gold on charcoal, Mizan, Raseed, Daftar, Hassala, Lamsa)
   PICTURE: charcoal hero card with the cash figure in gold, house mark in the header
   COLOUR and TYPE: brand gold #D9AA28, charcoal #1F1D19, paper #FBF8F1; Tajawal
   LAYOUT: one phone-width column, sticky month header, bottom tabs, bottom sheets */
:root{
  --bg:#FBF8F1; --card:#FFFFFF; --ink:#252525; --muted:#6E6A60; --line:#E8E0CB;
  --accent:#D9AA28; --accent-ink:#1F1D19; --accent-soft:#F6E7BC; --accent-text:#94700F;
  --usd:#3D5A80; --usd-soft:#E6EDF6;
  --good:#2E7D4F; --bad:#B3261E; --bad-soft:#FBE4E2;
  --hero:#1F1D19; --hero-ink:#F4EFE3; --hero-muted:#A8A396;
  --shadow:0 1px 2px rgba(31,29,25,.06),0 6px 18px rgba(31,29,25,.08);
  --f-body:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-num:"Tajawal",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14130F; --card:#1C1A15; --ink:#F1ECDF; --muted:#9A968C; --line:#35302A;
  --accent:#DDB03A; --accent-ink:#14130F; --accent-soft:#3A3020; --accent-text:#E8C35E;
  --usd:#9DB8DE; --usd-soft:#1E2A3A;
  --good:#6FCB94; --bad:#F08A80; --bad-soft:#3D1C19;
  --hero:#0F0E0B; --hero-ink:#F1ECDF; --hero-muted:#8F8A7E;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14130F; --card:#1C1A15; --ink:#F1ECDF; --muted:#9A968C; --line:#35302A;
  --accent:#DDB03A; --accent-ink:#14130F; --accent-soft:#3A3020; --accent-text:#E8C35E;
  --usd:#9DB8DE; --usd-soft:#1E2A3A;
  --good:#6FCB94; --bad:#F08A80; --bad-soft:#3D1C19;
  --hero:#0F0E0B; --hero-ink:#F1ECDF; --hero-muted:#8F8A7E;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.app{max-width:460px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:40px;height:40px;border-radius:12px;background:var(--hero);display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px}
.brand{font-family:var(--f-num);font-weight:800;font-size:18px;line-height:1.2;min-width:0;flex:1}
.brand #title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:800;font-size:16px;display:grid;place-items:center;overflow:hidden;padding:0;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.big{width:84px;height:84px;font-size:32px;margin:0 auto}
.month{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.month button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.month button:hover{background:var(--accent-soft)}
.month span{min-width:96px;text-align:center;font-weight:700;font-size:14px;line-height:1.2}
.month span small{display:block;font-size:10.5px;font-weight:400;color:var(--muted)}

section{display:flex;flex-direction:column;gap:12px;margin-top:14px}
h2{font-family:var(--f-num);font-size:16px;font-weight:700;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 .sub{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero .house{position:absolute;inset-inline-end:-14px;bottom:-10px;width:140px;height:auto;opacity:.16;pointer-events:none}
.hero .lbl{font-size:13px;color:var(--hero-muted)}
.hero .big{font-size:36px;font-weight:800;line-height:1.1;color:var(--accent)}
.hero .big small{font-size:15px;font-weight:500;color:var(--hero-ink)}
.hero .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid color-mix(in srgb,var(--hero-ink) 20%,transparent);padding-top:12px;position:relative}
.hero .row div{display:flex;flex-direction:column;min-width:0}
.hero .row b{font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums}
.hero .row span{font-size:11.5px;color:var(--hero-muted)}
.hero .btn{position:relative}

.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-family:var(--f-num);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:11.5px}
.u{font-size:.68em;font-weight:500}
.good{color:var(--good)} .bad{color:var(--bad)} .muted{color:var(--muted)}

.meter{height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13px}
.bar .track{height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar b{font-family:var(--f-num);font-weight:500;font-variant-numeric:tabular-nums;min-width:64px;text-align:end}

.spark{display:flex;align-items:flex-end;gap:3px;height:70px;padding-top:6px}
.spark i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.spark i.today{background:var(--usd)}
.spark i.future{background:var(--line)}
.spark-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:14px;flex:none}
.item .ic.usd{background:var(--usd-soft);color:var(--usd)}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.item .txt b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .txt span{font-size:12px;color:var(--muted)}
.item .amt{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.item .amt small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.item .amt input{width:96px;border:1px solid var(--accent);background:var(--bg);border-radius:10px;padding:7px 8px;font-size:16px;text-align:center}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:16px;flex:none}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.tap{cursor:pointer;border-radius:8px}
.list .tap:hover b{color:var(--accent-text)}
.tap .hint,.hint{font-size:11px;color:var(--accent-text)}
.chk{width:24px;height:24px;accent-color:var(--accent);flex:none}
.item.paid .txt b{color:var(--muted)}
.item.paid .amt{color:var(--muted)}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding-top:12px;font-weight:700}
.dayhead:first-child{padding-top:0}
.grouphead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;padding:12px 0 4px;border-bottom:1px solid var(--line)}
.grouphead:first-child{padding-top:0}
.grouphead.done{color:var(--good)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:10px;padding:10px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.ghost{background:var(--accent-soft);color:var(--accent-text)}
.btn.usd{background:var(--usd);color:var(--card)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.full{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.field input.num{text-align:start}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.conv{background:var(--usd-soft);color:var(--ink);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.conv b{font-family:var(--f-num);font-size:22px;color:var(--usd)}
.note{font-size:12px;color:var(--muted)}
.profile{display:flex;align-items:center;gap:12px}
.profile .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.profile .txt b{font-size:16px}
.profile .txt span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));inset-inline-end:max(calc(50% - 214px),calc(16px + env(safe-area-inset-left,0px)));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;font-weight:700;box-shadow:var(--shadow);z-index:6}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs div{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;line-height:1.2;text-align:center;color:var(--muted);min-height:56px}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--accent-text);font-weight:700}

.scrim{position:fixed;inset:0;background:rgba(15,14,11,.5);z-index:20}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:21;display:flex;justify-content:center}
.sheet>div{width:100%;max-width:460px;background:var(--card);border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.sheet h3{margin:0;font-family:var(--f-num);font-size:18px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:30;max-width:90vw;text-align:center}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 8px}
@media (prefers-reduced-motion:no-preference){.sheet>div{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
.lock{background:var(--usd-soft);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px}
.lock b{font-family:var(--f-num)}
.opt{display:flex;gap:12px;align-items:center;text-align:start;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;color:inherit;font:inherit;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--accent)}
.opt b{display:block;font-size:15px}.opt small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle;font-family:var(--f-body)}
.badge.open{background:var(--accent-soft);color:var(--accent-text)}
.badge.closed{background:var(--usd-soft);color:var(--usd)}
.hist{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hist:last-child{border-bottom:0}
.hist.on{background:var(--accent-soft);margin-inline:-14px;padding-inline:14px}
.hist b{font-family:var(--f-num);font-weight:700}
.hist .r{text-align:end;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.hist span{font-size:12px;color:var(--muted)}
.onb{display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center;padding-block:30px}
.onb h2{justify-content:center;font-size:20px}
.onb .house{width:120px;height:120px;margin:0 auto}
.onb .logo{width:150px;height:auto;margin:0 auto;display:block}
#launch{position:fixed;inset:0;z-index:999;background:#FBF8F1;display:grid;place-items:center;transition:opacity .35s}
#launch img{width:min(46vw,210px);height:auto;transform:scale(.6);transition:transform .8s ease-in-out}
#launch.grow img{transform:none}
#launch.out{opacity:0;pointer-events:none}
.back{border:1px solid var(--line);background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;padding:0}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}
[dir=ltr] .back svg{transform:scaleX(-1)}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px 0 -6px}
.sheethead .x{width:40px;height:40px;font-size:20px;background:var(--bg)}
.grab{width:56px;height:5px;margin:2px auto 8px;cursor:grab}
.sheet>div{touch-action:pan-y;will-change:transform}
.toast{cursor:pointer}
.toast .chip{background:transparent;color:inherit;border-color:currentColor;font-weight:700;padding:3px 12px}
html.modal,html.modal body{overscroll-behavior-y:none;overflow:hidden}
header.top{flex-wrap:wrap;row-gap:8px}
header.top .who{flex:1 1 100%}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--accent-text);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;padding:0}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9}
.install{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-top:10px}
.install img{width:40px;height:40px;border-radius:10px;flex:none}
.install div{flex:1;min-width:0;font-size:13px}
.install b{display:block;font-size:14px}
.qrbox{background:#fff;border-radius:16px;padding:12px;display:grid;place-items:center;border:1px solid var(--line)}
.qrbox img{width:min(240px,70vw);height:auto;image-rendering:pixelated}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}

/* ---------- shapes (skins). Classic = the original look above. Each shape only redefines tokens and a few surfaces. ---------- */
:root{--rad:16px}
.card,.stat{border-radius:var(--rad)}
.hero{border-radius:calc(var(--rad) + 4px)}
:root[data-skin="mizan"]{--bg:#F2F6F4;--card:#FFFFFF;--ink:#0E2A24;--muted:#557069;--line:#D5E3DC;--accent:#0F5C4D;--accent-ink:#FFFFFF;--accent-soft:#DCEDE5;--accent-text:#0F5C4D;--usd:#3D6A8C;--usd-soft:#E3EEF5;--hero:var(--accent);--hero-ink:#F2F6F4;--hero-muted:#BFDCD1;--f-body:"Readex Pro",system-ui,Tahoma,sans-serif;--f-num:"Readex Pro",system-ui,sans-serif;--rad:14px}

/* live dollar rate from CIB (the owner's salary bank) */
const RATE_SRC=['https://www.cibeg.com/api/currency/rates','https://raw.githubusercontent.com/ahmed-elbaz84/ahmed-elbaz84.github.io/main/rate.json'];
let RATE={buy:0,sell:0,at:null,busy:false,err:false};
try{const r=JSON.parse(localStorage.getItem('masrofat_cib_rate')||'null');if(r&&r.buy)Object.assign(RATE,r)}catch(e){}
function readRate(j){if(j&&Array.isArray(j.rates)){const u=j.rates.find(x=>x.currencyID==='USD');return u?{buy:+u.buyRate,sell:+u.sellRate}:null}
  return j&&j.buy?{buy:+j.buy,sell:+j.sell}:null}
/* most people are paid in pounds: the dollar parts only show for someone paid in dollars */
const usesUSD=()=>dollarOK()&&S.periods.some(p=>p.salary.cur==='USD'||p.transfers.length);
async function fetchRate(manual){
  if(CURC()!=='EGP'||(!manual&&!usesUSD()))return;
  if(RATE.busy)return;RATE.busy=true;RATE.err=false;if(manual)rerenderRate();
  let got=null;
  for(const u of RATE_SRC){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),5000);
    const r=await fetch(u+(u.includes('cibeg')?'':'?t='+Date.now()),{cache:'no-store',signal:ctl.signal});clearTimeout(tm);
    if(!r.ok)continue;got=readRate(await r.json());if(got&&got.buy>0)break;got=null}catch(e){}}
  RATE.busy=false;
  if(!got){RATE.err=true;rerenderRate();if(manual)toast(L('تعذّر جلب السعر، تأكد من اتصال الإنترنت','Could not get the rate; check your internet'));return}
  Object.assign(RATE,got,{at:Date.now()});try{localStorage.setItem('masrofat_cib_rate',JSON.stringify({buy:RATE.buy,sell:RATE.sell,at:RATE.at}))}catch(e){}
  if(S.rateAuto&&CURC()==='EGP'&&Math.abs(S.rate-RATE.buy)>0.0001){S.rate=RATE.buy;save();if(!sheetOpen()&&!typing())render();toast(L('سعر الدولار من CIB: ','CIB dollar rate: ')+RATE.buy)}
  else{rerenderRate();if(manual)toast(L('السعر لم يتغير: ','Rate unchanged: ')+RATE.buy)}
}

let curId=(S.periods[S.periods.length-1]||{}).id, tab='home', filter='*', QUICK=false;
const UNLOCKED=new Set();

/* installments & جمعية, by month key */
function plan(p,k){
  const i=mdiff(p.start,k), n=i+1, active=i>=0&&i<p.count;
  const paidCount=Object.keys(p.paid||{}).filter(x=>p.paid[x]&&mdiff(p.start,x)>=0&&mdiff(p.start,x)<p.count).length;
  const left=p.count-paidCount, end=shift(p.start,p.count-1);
  const payout=p.type==='جمعية'&&p.turn?shift(p.start,p.turn-1):null;
  return {n,active,paidNow:!!(p.paid||{})[k],paidCount,left,leftAmt:left*p.monthly,end,payout,payAmt:p.monthly*p.count,pct:paidCount/p.count*100};
}

/* savings wallets (Vodafone Cash…): balance = start + moves + extra money put in + expenses paid from it */
const W=id=>id&&S.wallets.find(w=>w.id===id);
function wMoves(w){const out=[];
  w.moves.forEach(m=>out.push({id:m.id,date:m.date,amount:m.kind==='in'?m.amount:-m.amount,type:m.kind,pid:m.pid,note:m.note}));
  S.periods.forEach(p=>{(p.extra||[]).forEach(x=>{if(x.to===w.id)out.push({date:x.date,amount:x.amount,type:'extra',note:x.src+(x.note?' · '+x.note:''),pid:p.id})});
    p.daily.forEach(d=>{if(d.from===w.id)out.push({date:d.date,amount:-d.amount,type:'spend',note:d.note||catN(d.cat),pid:p.id})})});
  return out.sort((a,b)=>b.date.localeCompare(a.date))}
const wBal=w=>(+w.start||0)+wMoves(w).reduce((a,m)=>a+m.amount,0);
const wTotal=()=>S.wallets.reduce((a,w)=>a+wBal(w),0);
function calc(p=P()){
  const k=p.key;
  const salaryEGP=p.salary.cur==='USD'?p.salary.amount*S.rate:p.salary.amount;
  const transUSD=p.transfers.reduce((a,t)=>a+t.usd,0);
  const transEGP=p.transfers.reduce((a,t)=>a+t.usd*t.rate,0);
  const carry=+p.carry||0; // left over from the month before, added on purpose when the new salary was entered
  const ex=p.extra||[], extra=ex.reduce((a,x)=>a+x.amount,0), extraW=ex.filter(x=>W(x.to)).reduce((a,x)=>a+x.amount,0);
  let toW=0,fromW=0;S.wallets.forEach(w=>w.moves.forEach(m=>{if(m.pid===p.id){if(m.kind==='in')toW+=m.amount;else fromW+=m.amount}}));
  const dailyW=p.daily.filter(d=>W(d.from)).reduce((a,d)=>a+d.amount,0);
  const wallet=-extraW+dailyW-toW+fromW; // money that went to / came from the wallets instead of the pocket
  const income=(p.salary.cur==='USD'?transEGP:p.salary.amount+transEGP)+carry+extra;
  const act=S.plans.filter(x=>plan(x,k).active);
  const plansAll=act.reduce((a,x)=>a+x.monthly,0), plansPaid=act.filter(x=>(x.paid||{})[k]).reduce((a,x)=>a+x.monthly,0);
  const fixedAll=p.fixed.reduce((a,f)=>a+f.amount,0)+plansAll;
  const fixedPaid=p.fixed.filter(f=>f.paid).reduce((a,f)=>a+f.amount,0)+plansPaid;
  const daily=p.daily.reduce((a,d)=>a+d.amount,0);
  const end=endOf(p), D=ddiff(p.start,end)+1;
  const el=p.end?D:Math.max(0,Math.min(D,ddiff(p.start,TODAY)+1));
  const left=Math.max(0,D-el);
  const usdLeft=p.salary.cur==='USD'?Math.max(0,p.salary.amount-transUSD):0;
  const cash=income-fixedPaid-daily+wallet, free=income-fixedAll-daily+wallet;
  const avg=el?daily/el:0, projected=fixedAll+avg*D, budget=salaryEGP+carry+extra-extraW;
  const allow=left?(free+usdLeft*S.rate)/left:0;
  const spent=(p.end?fixedPaid:fixedAll)+daily;
  return {p,act,carry,extra,extraW,toW,fromW,dailyW,salaryEGP,transUSD,transEGP,income,fixedAll,fixedPaid,daily,end,D,el,left,usdLeft,cash,free,avg,projected,budget,allow,spent};
}

      ${bills.map(f=>`<div class="pill pr tap" data-go="fixed"><span>${esc(f.name)} · ${L('لم يُدفع','not paid')}</span><b>${fmt(f.amount)}</b></div>`).join('')}`;

  else if(k==='raseed') top=`<div><div class="muted" style="font-size:13px">${leftLbl}</div><div class="bignum" style="font-size:40px"><span class="num">${fmt(c.cash)}</span> <small style="font-size:16px;font-weight:500">${CUR()}</small></div></div>

  } else top=`<div><div class="muted" style="font-size:13px">${leftLbl}</div><div class="bignum"><span class="num">${fmt(c.cash)}</span></div><div class="muted" style="font-size:13px">${CUR()} · ${range}</div></div>
    <div class="bento">

      <button class="tile" data-act="goMoney" style="background:#CDB4DB"><span>${daysLbl}</span><b>${days}</b></button>

  return `<div class="mz">${top}${extras}</div>`;

/* ---------- sheets ---------- */
let EDIT=null, CATMODE=null, PHOTO=null;
function catTools(list){return `<div class="btnrow" style="margin-top:6px"><button class="chip" data-act="catAdd" data-list="${list}">${L('+ نوع جديد','+ New type')}</button><button class="chip" data-act="catRen" data-list="${list}">${L('✎ تغيير اسم النوع المختار','✎ Rename selected type')}</button><button class="chip" data-act="catDel" data-list="${list}">${L('× حذف النوع المختار','× Delete selected type')}</button></div>
  <div id="catBack">${catBackHtml(list)}</div>
  <div class="btnrow" id="catBox" hidden style="align-items:center"><input id="catIn" style="flex:2;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-size:16px;min-width:0"><button class="btn" data-act="catOk" data-list="${list}" style="flex:1">${L('تم','OK')}</button></div>`}
function lostCats(list){const key=list==='cats'?'daily':'fixed',seen=[];S.periods.forEach(p=>(p[key]||[]).forEach(x=>{if(x.cat&&!S[list].includes(x.cat)&&!seen.includes(x.cat))seen.push(x.cat)}));return seen}
function catBackHtml(list){const l=lostCats(list);return l.length?`<div class="btnrow" style="margin-top:6px;flex-wrap:wrap;align-items:center"><span class="hint">${L('أنواع محذوفة عليها مصروفات:','Deleted types with expenses:')}</span>${l.map(c=>`<button class="chip" data-act="catBack" data-list="${list}" data-v="${esc(c)}">${L('↺ استعادة «','↺ Restore "')}${esc(catN(c))}${L('»','"')}</button>`).join('')}</div>`:''}
function selCat(list){return list==='cats'?(($('#fCats .chip.on')||{}).dataset||{}).pick:($('#fCat')||{}).value}
function renameCat(list,old,nw){
  if(!nw||old===nw)return false; if(S[list].includes(nw)){toast(L('هذا الاسم موجود','That name exists'));return false}
  const i=S[list].indexOf(old); if(i>-1)S[list][i]=nw; else S[list].push(nw);
  const key=list==='cats'?'daily':'fixed';
  S.periods.forEach(p=>p[key].forEach(x=>{if(x.cat===old)x.cat=nw}));
  save(); return true;
}
function refreshCatsInSheet(list,pick){
  if($('#catBack'))$('#catBack').innerHTML=catBackHtml(list);
  if(list==='cats')$('#fCats').innerHTML=S.cats.map(c=>`<button class="chip ${c===pick?'on':''}" data-pick="${esc(c)}">${esc(catN(c))}</button>`).join('');
  else $('#fCat').innerHTML=S.fixedCats.map(c=>`<option value="${esc(c)}" ${c===pick?'selected':''}>${esc(catN(c))}</option>`).join('');
}

    const sel=o?o.cat:(PRECAT&&S.cats.includes(PRECAT)?PRECAT:S.cats[0]);PRECAT=null;

function closeSheet(fromBack){if(!sheetOpen())return;VOICE.stop();$('#overlay').innerHTML='';setTimeout(()=>{SYNC.flush();DRIVE.flush()},50);
  document.documentElement.classList.remove('modal');NAVSHEET=null;saveNav();

let SKIP_POP=false, NAVSHEET=null, EXIT_AT=0;
/* remember where the user is, so a refresh keeps the same page */
function saveNav(){try{sessionStorage.setItem('masrofat_nav',JSON.stringify({tab,curId,sheet:NAVSHEET,y:Math.round(scrollY)}))}catch(e){}}
addEventListener('scroll',()=>{clearTimeout(saveNav.t);saveNav.t=setTimeout(saveNav,250)},{passive:true});
/* phone Back button / gesture: close the open sheet, else go to the previous tab; on Home, press twice to leave */
addEventListener('popstate',e=>{
  if(SKIP_POP){SKIP_POP=false;return}
  if(sheetOpen()){closeSheet(true);return}
  const st=e.state||{};
  if(st.root||!st.app){
    if(Date.now()-EXIT_AT<2500){EXIT_AT=0;try{history.back()}catch(err){}return}
    EXIT_AT=Date.now();try{history.pushState({app:1,tab:'home'},'')}catch(err){}
    if(tab!=='home'){tab='home';filter='*';QUICK=false;render();scrollTo(0,0)}
    toast(L('اضغط رجوع مرة أخرى للخروج من التطبيق','Press Back again to leave the app'));return}
  tab=st.tab||'home';filter='*';QUICK=false;render();scrollTo(0,0)});
addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen())closeSheet();if(e.key==='Enter'&&e.target.id==='vText'){e.preventDefault();VOICE.run(e.target.value)}});
/* swipe a sheet down to close it */
let DRAG=null;
document.addEventListener('touchstart',e=>{const box=e.target.closest('.sheet>div');if(!box)return;
  if(box.scrollTop>2&&!e.target.closest('.grab,.sheethead'))return;
  DRAG={y:e.touches[0].clientY,box,dy:0,on:false}},{passive:true});
document.addEventListener('touchmove',e=>{if(!DRAG)return;const dy=e.touches[0].clientY-DRAG.y;
  if(!DRAG.on){if(dy<8){if(dy<-8)DRAG=null;return}DRAG.on=true;const a=document.activeElement;if(a&&a.blur)a.blur()}
  if(e.cancelable)e.preventDefault();
  DRAG.dy=dy;DRAG.box.style.transition='none';DRAG.box.style.transform=`translateY(${Math.max(0,dy)}px)`},{passive:false});
document.addEventListener('touchend',()=>{if(!DRAG)return;const {box,dy,on}=DRAG;DRAG=null;if(!on)return;
  box.style.transition='transform .2s ease-out';
  if(dy>90){box.style.transform='translateY(110%)';setTimeout(()=>closeSheet(),190)}else box.style.transform=''});
/* toasts: tap or swipe to dismiss */
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.toast');if(t&&!e.target.closest('button'))t.remove()});
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2400)}
const numv=id=>parseFloat(String(($(id)||{}).value||'').replace(/,/g,''))||0;
function readPhoto(file,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=180,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);cb(c.toDataURL('image/jpeg',.82))};img.onerror=()=>toast(L('تعذّرت قراءة هذه الصورة','Could not read that image'));img.src=fr.result};fr.readAsDataURL(file)}

    if(!inn&&amount>wBal(w)+0.001){toast(L(`رصيد ${w.name} ${fmt(wBal(w))} ${CUR()} فقط`,`${w.name} only has ${fmt(wBal(w))} ${CUR()}`));return}
    const target=periodFor(date);
    if(!target){toast(L('هذا التاريخ قبل بداية الحساب','That date is before the account started'));return}
    if(isRO(target)){toast(L('هذا التاريخ في ','That date is in ')+pname(target)+L(' وهو مغلق',' which is closed'));return}
    if(ext){(target.extra=target.extra||[]).push({id:uid(),date,amount,src:(($('#wmSrc .chip.on')||{}).dataset||{}).pick||S.extraSrc[0],note:$('#wmNote').value.trim(),to:w.id})}
    else w.moves.push({id:uid(),kind:inn?'in':'out',pid:target.id,date,amount});
    save();render();openSheet('wallet',w);toast(inn?L(`تم إيداع ${fmt(amount)} ${CUR()} في ${w.name}`,`${fmt(amount)} ${CUR()} put in ${w.name}`):L(`تم سحب ${fmt(amount)} ${CUR()} من ${w.name}`,`${fmt(amount)} ${CUR()} taken from ${w.name}`));return}
  if(a==='saveSalary'){const p=P();const start=$('#salStart').value,end=$('#salEnd').value,key=$('#salKey').value;
    const pv=prevP(p),nx=nextP(p);
    if(!start||!end||end<start){toast(L('يجب أن يكون آخر يوم بعد أول يوم','Last day must be after the first'));return}
    if(pv&&start<=pv.start){toast(L('يجب أن يكون أول يوم بعد ','First day must be after ')+dshort(pv.start));return}
    if(nx&&end>=nx.start){toast(L('يجب أن يكون آخر يوم قبل ','Last day must be before ')+dshort(nx.start));return}
    p.start=start; if(p.end)p.end=end; else p.planEnd=end; if(key)p.key=key;
    if(pv)pv.end=addDays(start,-1);
    p.salary={amount:numv('#salAmt'),cur:SALCUR||p.salary.cur};const r=numv('#salRate');if(r)S.rate=r;
    if($('#salCarry')){const cv=numv('#salCarry');if(cv>0)p.carry=cv;else delete p.carry}
    save();render();toast(L('تم حفظ راتب ','Saved salary · ')+pname(p));if(p.salary.cur==='USD'&&!RATE.at)fetchRate(false);return}
  if(a==='salPrev'){const pv=prevP(P());if(!pv){toast(L('لا يوجد شهر سابق','No earlier month'));return}$('#salAmt').value=pv.salary.amount;SALCUR=pv.salary.cur;
    document.querySelectorAll('#salCurChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.salcur===SALCUR));updSal();return}
  if(a==='savePlan'){const name=$('#pName').value.trim(),monthly=numv('#pAmt'),count=Math.round(numv('#pCount')),start=$('#pStart').value||TODAY.slice(0,7);
    if(!name||!monthly||!count){toast(L('اكتب الاسم والمبلغ وعدد الشهور','Enter name, amount and months'));return}
    const type=$('#pType .chip.on').dataset.pick, paid={};
    for(let i=0;i<count;i++){const k=shift(start,i);if(k<TODAY.slice(0,7))paid[k]=1}
    const turn=type==='جمعية'?Math.min(Math.round(numv('#pTurn'))||0,count):0;
    const leftMsg=i=>L(`المتبقي ${i.left} ${type==='جمعية'?'شهر':'قسط'}`,`${i.left} ${type==='جمعية'?'months':'payments'} left`);
    if(EDIT){const old=S.plans.find(x=>x.id===EDIT);Object.assign(old,{type,name,monthly,count,start});if(turn)old.turn=turn;else delete old.turn;
      save();closeSheet();render();toast(L('تم التعديل · ','Updated · ')+leftMsg(plan(old,P()?P().key:start)));return}
    const x={id:uid(),type,name,monthly,count,start,paid};if(turn)x.turn=turn;
    S.plans.push(x);save();closeSheet();render();toast(L('تمت الإضافة · ','Added · ')+leftMsg(plan(x,start)));return}
  if(a==='copyFixed'){const pv=prevP(P());const p=P();const have=new Set(p.fixed.map(f=>f.name));
    pv.fixed.forEach(f=>{if(!have.has(f.name))p.fixed.push({id:uid(),name:f.name,cat:f.cat,amount:f.amount,paid:false})});save();render();toast(L('تم نسخ المصروفات الأساسية','Bills copied'));return}
  if(a==='saveTransfer'){const u=numv('#cvUsd'),r=numv('#cvRate');if(!u||!r){toast(L('اكتب المبلغ والسعر','Enter amount and rate'));return}
    {const c=calc();if(c.p.salary.cur==='USD'&&u>c.usdLeft+0.001){toast(L(`المتبقي بالدولار ${fmt(c.usdLeft)}$ فقط`,`Only $${fmt(c.usdLeft)} left`));return}}
    const p=P();p.transfers.push({id:uid(),date:p.end?p.start:TODAY,usd:u,rate:r});save();render();toast(L('تم تسجيل تحويل $','Recorded $')+fmt(u));return}
  if(a==='fresh'){if(!t.dataset.sure){t.dataset.sure='1';t.textContent=L('هل أنت متأكد؟ اضغط مرة أخرى وسيُحذف كل ما سبق','Sure? Tap again to delete everything');return}
    S=keepMine({rate:S.rate,cats:S.cats,fixedCats:S.fixedCats,plans:[],debts:[],periods:[]});fill();curId=null;save();tab='home';render();openSheet('newPeriod');return}
  if(a==='syncIn'||a==='syncNew'){const em=$('#syEmail').value.trim(),pw=$('#syPass').value;
    PENDING_PW=pw;
    const fn=a==='syncIn'?firebase.auth().signInWithEmailAndPassword(em,pw):firebase.auth().createUserWithEmailAndPassword(em,pw);
    SYNC.status=L('لحظة…','One moment…');fn.then(()=>{if(!S.profile.email){S.profile.email=em;save()}toast(L('تم تسجيل الدخول، وبياناتك محفوظة ومؤمّنة بكلمة المرور','Signed in; your numbers are saved and locked with your password'))}).catch(e=>{PENDING_PW=null;SYNC.status=authErr(e.code);render()});return}
  if(a==='syncForgot'){const em=$('#syEmail').value.trim();if(!em){toast(L('اكتب بريدك أولًا','Enter your email first'));return}
    firebase.auth().sendPasswordResetEmail(em).then(()=>toast(L('أرسلنا إلى بريدك رسالة لتغيير كلمة المرور','We emailed you a link to change the password'))).catch(e=>{SYNC.status=authErr(e.code);render()});return}
  if(a==='storeDrive'){DRIVE.connect();return}
  if(a==='storeLocal'){setStore('local');render();toast(L('ستبقى بياناتك على هذا الهاتف. يمكنك تغيير ذلك من الإعدادات','Your numbers stay on this phone. You can change this in Settings'));return}
  if(a==='storeAccount'){setStore('account');if(!SYNC.on)location.reload();else render();return}
  if(a==='driveNow'){if(DRIVE.ok())DRIVE.sync();else DRIVE.connect();return}
  if(a==='driveOff'){if(!t.dataset.sure){t.dataset.sure='1';t.textContent=L('هل أنت متأكد؟ اضغط مرة أخرى','Sure? Tap again');return}DRIVE.unlink();toast(L('تم فصل Google Drive. بياناتك ما زالت على الهاتف، والملف ما زال على Drive الخاص بك','Google Drive unlinked. Your numbers are still on the phone, and the file is still in your Drive'));return}
  if(a==='accSkip'){ACC_SKIP=true;try{localStorage.setItem('masrofat_acc_skip','1')}catch(e){}render();return}
  if(a==='syncOut'){if(SYNC.user)CRYPT.forget(SYNC.user.uid);firebase.auth().signOut().then(()=>toast(L('تم تسجيل الخروج من المزامنة على هذا الجهاز','Signed out of sync on this device')));return}
  if(a==='install'){if(INSTALL_EVT){INSTALL_EVT.prompt();INSTALL_EVT.userChoice.finally(()=>{INSTALL_EVT=null;render()});return}openSheet('install');return}
  if(a==='installNow'){if(INSTALL_EVT){INSTALL_EVT.prompt();INSTALL_EVT.userChoice.finally(()=>{INSTALL_EVT=null;closeSheet();render()})}return}
  if(a==='installHide'){INSTALL_HIDE=true;try{localStorage.setItem('masrofat_install_hide','1')}catch(e){}render();return}
  if(a==='shareSend'){const d={title:L('مصروفات البيت','Home Expenses'),text:L('تطبيق «مصروفات البيت» لحساب مصروفات البيت. افتح الرابط وثبّته على هاتفك:','"Home Expenses" app for household spending. Open the link and install it:'),url:APP_URL};
    if(navigator.share)navigator.share(d).catch(()=>{});else location.href='https://wa.me/?text='+encodeURIComponent(d.text+' '+APP_URL);return}
  if(a==='shareCopy'){const done=()=>toast(L('تم نسخ الرابط','Link copied'));(navigator.clipboard?navigator.clipboard.writeText(APP_URL).then(done):Promise.reject()).catch(()=>{prompt(L('انسخ الرابط:','Copy the link:'),APP_URL)});return}
  if(a==='backup'){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='masrofat-elbeit-backup-'+TODAY+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast(L('تم تنزيل النسخة الاحتياطية','Backup downloaded'));return}
  if(a==='lookDone'){closeSheet();return}
  if(a==='voiceOpen'){openVoice(true);return}
  if(a==='voiceMic'){if(VOICE.on)VOICE.stop();else VOICE.listen();return}
  if(a==='voiceRun'){VOICE.run(($('#vText')||{}).value);return}
  if(a==='voiceUndo'){const x=t.closest('.toast');if(x)x.remove();VOICE.undo();return}
  if(a==='moreGo'){const k=t.dataset.t;closeSheet();setTimeout(()=>go(k),80);return}
  if(a==='restore'){$('#restoreFile').click();return}
  if(a==='reset'){if(S.periods.length&&!t.dataset.sure){t.dataset.sure='1';t.textContent=L('هل أنت متأكد؟ ستُحذف بياناتك. اضغط مرة أخرى','Sure? Your numbers will be deleted. Tap again');return}S=keepMine(sample());fill();curId=S.periods[S.periods.length-1].id;save();tab='home';render();toast(L('تم تحميل البيانات التجريبية','Sample numbers loaded'));return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ppaid){const x=S.plans.find(y=>y.id===t.dataset.ppaid);if(x){const k=P().key;x.paid=x.paid||{};if(t.checked)x.paid[k]=1;else delete x.paid[k];save();render();const i=plan(x,k);toast(i.left?L(`انتقل إلى «مدفوع» · المتبقي ${i.left}`,`Moved to "Paid" · ${i.left} left`):L('انتهى','Done'))}}
  if(t.dataset.paid){const f=P().fixed.find(x=>x.id===t.dataset.paid);if(!f)return;
    if(t.checked){t.checked=false;openSheet('payFixed',f)}
    else{f.paid=false;delete f.paidOn;save();render();toast(L('أُعيد إلى «لم يُدفع بعد»','Moved back to "Not paid"'))}}
  if(t.id==='fPaid'){$('#fPaidOnF').hidden=!t.checked}
  if(t.id==='voiceAuto'){S.voiceAuto=t.checked;save();return}
  if(t.dataset.card){const cs=homeCards(),x=cs.find(y=>y.k===t.dataset.card);if(x){x.on=t.checked;S.cards=cs;save();render()}return}
  if(t.id==='curSel'){S.cur=t.value;if(S.cur!=='EGP')S.rateAuto=false;save();render();toast(L('تم تغيير العملة','Currency changed'));return}
  if(t.id==='pfFile'&&t.files[0]){readPhoto(t.files[0],url=>{PHOTO=url;$('#pfAv').innerHTML=`<img src="${url}" alt="">`});t.value='';return}
  if(t.id==='restoreFile'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.periods)throw 0;S=d;fill();LANG=S.lang;curId=(S.periods[S.periods.length-1]||{}).id;save();tab='home';render();toast(L('تمت استعادة النسخة الاحتياطية','Backup restored'))}catch(e){toast(L('هذا الملف ليس نسخة احتياطية من التطبيق','That file is not a backup from this app'))}};fr.readAsText(t.files[0]);t.value='';return}
  if(t.id==='rate'){const r=numv('#rate');if(r){S.rate=r;const was=S.rateAuto;S.rateAuto=false;save();render();toast(was?L('تم حفظ السعر، وتوقف التحديث من CIB','Rate saved; CIB auto-update turned off'):L('تم حفظ السعر','Rate saved'))}}
  if(t.id==='rateAuto'){S.rateAuto=t.checked;save();if(S.rateAuto)fetchRate(true);else{render();toast(L('سيُحسب بالسعر الذي تكتبه','Using the rate you type'))}}
  if(t.id==='nDate'){const d=t.value;if(d){$('#nKey').value=keyFor(d);const c=$('#nClose');if(c)c.textContent=dshort(addDays(d,-1))}}
});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='cvUsd'||id==='cvRate')updConv();
  if(id==='salAmt'||id==='salRate')updSal();
  if(id==='wmAmt')updWm();
  if(id==='nSave')updNSave();
  if(id==='pfName'&&!PHOTO){$('#pfAv').innerHTML=esc(initial(e.target.value))||'—'}
  if(id==='pAmt'||id==='pCount'){const n=Math.round(numv('#pCount')),st=$('#pStart').value||TODAY.slice(0,7);$('#pSum').innerHTML=`<span>${L('الإجمالي','Total')}${n?L(' · آخر شهر ',' · last month ')+keyLabel(shift(st,n-1)):''}</span><b class="num">${fmt(numv('#pAmt')*n)} ${CUR()}</b>`}
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!typing()&&!sheetOpen()){SYNC.flush();DRIVE.flush()}},300));
/* numbers carried over from the old address (ahmed-elbaz84.github.io): they come in the part of the link after #,
   which browsers never send to any server, and are removed from the address right away */
(function(){const h=location.hash;if(!h.startsWith('#move='))return;history.replaceState(null,'',location.pathname+location.search);
  let d=null;try{const b=atob(h.slice(6).replace(/-/g,'+').replace(/_/g,'/'));d=JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))))}catch(e){}
  if(!d||!d.periods){toast(L('تعذّر نقل البيانات، نزّل نسخة احتياطية من التطبيق القديم واستعدها هنا','Could not move the numbers; download a backup in the old app and restore it here'));return}
  if(S.periods.length&&!confirm(L('يحتوي التطبيق هنا على بيانات. هل تريد استبدالها بالبيانات القادمة من التطبيق القديم؟','This app already has numbers. Replace them with the ones from the old app?')))return;
  S=d;fill();LANG=S.lang;curId=(S.periods[S.periods.length-1]||{}).id;tab='home';save();render();toast(L('تم نقل بياناتك ✓','Your numbers moved ✓'))})();
SYNC.load();DRIVE.init();
/* offline: everything is kept on the phone; as soon as the internet is back, send what was added */
const syncBack=()=>{if(!navigator.onLine)return;if(!SYNC.ready)SYNC.load();else if(SYNC.user)SYNC.pushNow()};
addEventListener('online',syncBack);
addEventListener('online',()=>{if(DRIVE.linked()&&DRIVE.ok())DRIVE.sync()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&DRIVE.linked()&&DRIVE.ok())DRIVE.sync()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SYNC.ready&&SYNC.user&&(S._ts||0)>(SYNC.sent||0))SYNC.pushNow()});
setTimeout(()=>fetchRate(false),800);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(!RATE.at||Date.now()-RATE.at>10*60e3))fetchRate(false)});
setInterval(()=>{if(document.visibilityState==='visible')fetchRate(false)},30*60e3);
(function(){const v=/[?&]voice=1/.test(location.search);if(v)history.replaceState(null,'',location.pathname);
  if((v||S.voiceAuto)&&P()&&!isRO())setTimeout(()=>{if(!sheetOpen())openVoice(true)},v?500:900)})();
if(/[?&]install=1/.test(location.search)&&!isStandalone()){history.replaceState(null,'',location.pathname);setTimeout(()=>{if(!sheetOpen())openSheet('install')},1500)}
let NAV0=null, REOPEN=false;try{NAV0=JSON.parse(sessionStorage.getItem('masrofat_nav')||'null')}catch(e){}
if(NAV0&&['home','daily','fixed','money','wallets','settings'].includes(NAV0.tab)){tab=NAV0.tab;if(NAV0.curId&&S.periods.find(x=>x.id===NAV0.curId))curId=NAV0.curId}
try{const st=history.state;
  if(st&&st.app){ // refreshed: keep the history we already have
    if(st.sheet&&NAV0&&NAV0.sheet){history.replaceState({app:1,tab,sheet:1},'');REOPEN=true}
    else if(st.sheet){SKIP_POP=true;history.back()}
    else history.replaceState({app:1,tab,root:st.root?1:undefined},'')}
  else{history.replaceState({app:1,root:1,tab:'home'},'');history.pushState({app:1,tab:'home'},'');if(tab!=='home')history.pushState({app:1,tab},'')}}catch(e){}
$('#fab').onclick=()=>openSheet(tab==='fixed'?'fixed':'daily');
$('#mPrev').onclick=()=>{const p=prevP(P());if(p){curId=p.id;QUICK=false;render()}};
$('#mNext').onclick=()=>{const p=nextP(P());if(p){curId=p.id;QUICK=false;render()}};
render();
if(NAV0){if(NAV0.y)setTimeout(()=>scrollTo(0,NAV0.y),60);
  const sh=NAV0.sheet;if(sh&&sh.kind){const p=P();let o=null;
    if(sh.id){if(sh.kind==='daily'||sh.kind==='fixed'||sh.kind==='payFixed')o=p&&p[sh.kind==='daily'?'daily':'fixed'].find(x=>x.id===sh.id);
      else if(sh.kind==='plan')o=S.plans.find(x=>x.id===sh.id);else if(sh.kind==='wallet'||sh.kind==='walletEdit')o=W(sh.id);else if(sh.kind==='extra')o=p&&(p.extra||[]).find(x=>x.id===sh.id);else if(sh.kind==='debt'||sh.kind==='debtPay')o=S.debts.find(x=>x.id===sh.id)}
    if(!sh.id||o){try{openSheet(sh.kind,o||undefined)}catch(e){}}}REOPEN=false}
})();
</script>
